services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jareed
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: jareed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jareed -d jareed"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  api:
    build: ./apps/api
    env_file: .env
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./apps/api
    command: ["node", "src/worker.mjs"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: nginx:1.27-alpine
    ports: ["3000:80"]
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
