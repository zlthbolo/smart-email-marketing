version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart-email-db
    environment:
      POSTGRES_USER: ${DB_USER:-smart_email}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      POSTGRES_DB: ${DB_NAME:-smart_email_marketing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smart_email}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-email-redis
    ports:
      - "6379:6379"
    networks:
      - smart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-email-backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-smart_email}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      DB_NAME: ${DB_NAME:-smart_email_marketing}
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-email-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - smart-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:3001

volumes:
  postgres_data:

networks:
  smart-network:
    driver: bridge
