name: Production CI

on:
  push:
    branches:
      - codex/jareed-foundation
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'platform/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/production-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API tests
        run: npm test

      - name: Web tests
        run: npm run test:web

      - name: Syntax check production browser adapter
        run: node --check apps/web/production.js

      - name: Validate Northflank template JSON
        run: node -e "JSON.parse(require('fs').readFileSync('platform/northflank.template.json','utf8')); console.log('Northflank template JSON OK')"

      - name: Build production Docker image
        run: docker build -f platform/Dockerfile.production -t jareed-soft:ci .
