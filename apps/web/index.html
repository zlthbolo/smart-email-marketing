<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>جريد سوفت</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="native.css">
</head>
<body>
<div id="appView" class="app">
  <aside>
    <div class="logo">جريد <span>سوفت</span></div>
    <nav>
      <button data-page="overview" class="active">الرئيسية</button>
      <button data-page="mailboxes">المرسلون</button>
      <button data-page="contacts">الجمهور</button>
      <button data-page="campaigns">الحملات</button>
      <button data-page="inbox">الردود <span id="inboxBadge" class="nav-count hidden">0</span></button>
      <button data-page="research">الجامعات</button>
      <button data-page="outbox">الاختبار</button>
      <button data-page="settings">الإعدادات</button>
    </nav>
  </aside>

  <main>
    <header>
      <div>
        <p id="pageEyebrow" class="hidden"></p>
        <h1 id="pageTitle">الرئيسية</h1>
      </div>
      <div class="user hidden" aria-hidden="true"><span id="userName"></span><i id="systemDot" class="healthy"></i></div>
    </header>
    <div id="notice"></div>

    <section data-view="overview">
      <div class="page-actions"><button id="refreshAll">تحديث</button></div>
      <div class="metrics">
        <article><p>المرسلون</p><h2 id="mailboxCount">0</h2></article>
        <article><p>الحسابات السليمة</p><h2 id="healthyMailboxCount">0</h2></article>
        <article><p>أُرسل اليوم</p><h2 id="sentTodayCount">0</h2><small id="dailyCapacity">0 / 0</small></article>
        <article><p>الجمهور</p><h2 id="contactCount">0</h2></article>
        <article><p>الحملات</p><h2 id="campaignCount">0</h2></article>
        <article><p>الجامعات</p><h2 id="universityCount">0</h2></article>
        <article><p>الاختبارات</p><h2 id="outboxCount">0</h2></article>
        <article><p>الردود</p><h2 id="replyCount">0</h2></article>
      </div>
      <div class="decision-grid">
        <div class="panel"><h2>الخطوات</h2><div id="nextActions" class="action-list"></div></div>
        <div class="panel"><h2>الجامعات</h2><div id="universityInsights" class="insight-list"></div></div>
      </div>
    </section>

    <section data-view="mailboxes" class="hidden">
      <div class="toolbar">
        <button id="googleConnect">Gmail</button>
        <button id="microsoftConnect">Microsoft</button>
      </div>
      <div class="split">
        <form id="mailboxForm" class="panel form">
          <h2>إضافة مرسل</h2>
          <select name="provider">
            <option value="test_sink">اختبار محلي</option>
            <option value="smtp">SMTP</option>
            <option value="api">API</option>
          </select>
          <input name="displayName" placeholder="اسم المرسل">
          <input name="email" type="email" placeholder="البريد" required>
          <div class="smtp-only hidden">
            <input name="host" placeholder="خادم SMTP">
            <input name="port" type="number" value="587" aria-label="المنفذ">
            <input name="username" placeholder="اسم المستخدم">
            <input name="password" type="password" autocomplete="new-password" placeholder="كلمة مرور التطبيق">
            <label class="compact-check"><input name="secure" type="checkbox"> SSL</label>
          </div>
          <div class="api-only hidden">
            <select name="apiKind"><option value="resend">Resend</option><option value="postmark">Postmark</option></select>
            <input name="apiKey" type="password" autocomplete="new-password" placeholder="API Key">
          </div>
          <label class="field-label">الحد اليومي<input name="dailyLimit" type="number" value="25" min="1"></label>
          <button class="primary">حفظ</button>
        </form>
        <div class="panel"><h2>المرسلون</h2><div id="mailboxList" class="list"></div></div>
      </div>
    </section>

    <section data-view="contacts" class="hidden">
      <div class="split">
        <form id="contactForm" class="panel form">
          <h2>إضافة جهة</h2>
          <input name="email" type="email" placeholder="البريد" required>
          <input name="firstName" placeholder="الاسم">
          <input name="university" placeholder="الجامعة">
          <input name="specialization" placeholder="التخصص">
          <select name="consentBasis" required>
            <option value="explicit_opt_in">موافقة صريحة</option>
            <option value="contractual">علاقة تعاقدية</option>
            <option value="legitimate_interest">مصلحة مشروعة</option>
            <option value="legal_obligation">التزام قانوني</option>
          </select>
          <input name="consentSource" placeholder="مصدر الموافقة" required>
          <button class="primary">إضافة</button>
        </form>
        <div class="panel"><h2>الجمهور</h2><div id="contactList" class="list"></div></div>
      </div>
    </section>

    <section data-view="campaigns" class="hidden">
      <div class="split">
        <form id="campaignForm" class="panel form">
          <h2>حملة جديدة</h2>
          <input name="university" placeholder="الجامعة">
          <input name="specialization" placeholder="التخصص">
          <textarea name="aiBrief" rows="3" placeholder="ملاحظات"></textarea>
          <button id="generateCampaign" type="button" class="hidden"></button>
          <input name="name" placeholder="اسم الحملة" required>
          <select name="mailboxId" id="campaignMailbox" required></select>
          <input name="senderName" placeholder="اسم المرسل" required>
          <input name="subject" placeholder="العنوان" required>
          <textarea name="html" rows="6" placeholder="الرسالة" required></textarea>
          <textarea name="text" rows="4" placeholder="النص البديل"></textarea>
          <input name="physicalAddress" placeholder="العنوان البريدي" required>
          <label class="field-label">الفاصل بالثواني<input name="maxJitterSeconds" type="number" value="120" min="0" max="3600"></label>
          <button class="primary">حفظ</button>
        </form>
        <div class="panel"><h2>الحملات</h2><div id="campaignList" class="list"></div></div>
      </div>
    </section>

    <section data-view="inbox" class="hidden">
      <div class="inbox-head panel">
        <h2>الردود</h2>
        <div class="toolbar inbox-filters">
          <select id="inboxIntent" aria-label="التصنيف">
            <option value="">الكل</option><option value="interested">مهتم</option><option value="question">سؤال</option>
            <option value="not_interested">غير مهتم</option><option value="out_of_office">خارج المكتب</option>
            <option value="unsubscribe">إلغاء الاشتراك</option><option value="unknown">غير واضح</option>
          </select>
          <select id="inboxState" aria-label="الحالة"><option value="unhandled">جديدة</option><option value="handled">مراجَعة</option><option value="">الكل</option></select>
          <button id="refreshInbox">تحديث</button>
        </div>
      </div>
      <div id="inboxList" class="inbox-list"></div>
    </section>

    <section data-view="research" class="hidden">
      <div class="split">
        <div>
          <form id="universityForm" class="panel form">
            <h2>إضافة جامعة</h2>
            <input name="name" placeholder="الاسم" required>
            <input name="officialUrl" type="url" placeholder="الموقع الرسمي" required>
            <input name="countryCode" placeholder="رمز الدولة">
            <button class="primary">إضافة</button>
          </form>
          <form id="researchForm" class="panel form">
            <h2>بحث</h2>
            <select name="universityId" id="researchUniversity" required></select>
            <textarea name="objective" rows="5" placeholder="الهدف" required></textarea>
            <select name="mode"><option value="official">رسمي</option><option value="broad">موسّع</option></select>
            <button class="primary">بدء</button>
          </form>
        </div>
        <div class="panel"><h2>النتائج</h2><div id="researchList" class="list"></div></div>
      </div>
    </section>

    <section data-view="outbox" class="hidden">
      <div class="panel"><h2>الاختبار</h2><div id="outboxList" class="list"></div></div>
    </section>

    <section data-view="settings" class="hidden">
      <div class="split settings-grid">
        <form id="settingsForm" class="panel form">
          <h2>الإعدادات</h2>
          <input name="defaultSenderName" placeholder="اسم المرسل الافتراضي">
          <input name="testRecipient" type="email" placeholder="مستلم الاختبار">
          <label class="field-label">الحد اليومي الافتراضي<input name="defaultDailyLimit" type="number" min="1" max="500" value="25" required></label>
          <label class="field-label">التذبذب الافتراضي بالثواني<input name="defaultJitterSeconds" type="number" min="0" max="3600" value="120" required></label>
          <button class="primary">حفظ</button>
        </form>
        <div class="panel">
          <h2>بيانات الهاتف</h2>
          <div id="settingsStats" class="settings-stats"></div>
          <button id="exportData" type="button">تصدير</button>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="dialog"><div id="dialogBody"></div><button onclick="dialog.close()">إغلاق</button></dialog>
<script src="app.js"></script>
</body>
</html>
